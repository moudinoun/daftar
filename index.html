<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar دفتر</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101826">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: the familiar expense-app shell (tabs on top, five-slot bar below, round add button), in Daftar's ink-and-teal ledger colours. Dark by choice; the in-app night-mode switch flips the skin. */
:root{
  --bg:#101826; --card:#1a2434; --card2:#243047; --ink:#e9eef5; --mute:#8f9db2; --rule:#2b384d;
  --accent:#2fb39f; --accent-ink:#04211d; --in:#4cc38a; --out:#ef6f5e; --move:#58a6e8; --gold:#e0b452;
  --display:"Noto Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --body:"Noto Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
:root.light{
  --bg:#f3f5ef; --card:#ffffff; --card2:#eaeee6; --ink:#15233a; --mute:#5d6b7c; --rule:#d9dfd6;
  --accent:#0f7a6d; --accent-ink:#ffffff; --in:#1c7d45; --out:#b93a26; --move:#2b5c9a; --gold:#9a6f14;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--in)} .out{color:var(--out)} .move{color:var(--move)} .mute{color:var(--mute)} .gold{color:var(--gold)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--card);min-height:56px}
header h1{font-family:var(--display);font-size:20px;margin:0;font-weight:700;flex:1}
header select{width:auto;background:none;border:0;font-weight:600;font-size:17px;padding:4px 0;flex:1}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card)}
.tabs button{padding:12px 4px;color:var(--mute);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
main{flex:1;overflow-y:auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:12px}
main>*{flex:none}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--rule);align-items:end}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;font-size:12.5px;color:var(--mute)}
nav button[aria-current="true"]{color:var(--ink);font-weight:600}
nav .fab{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);justify-self:center;justify-content:center;margin-top:-22px;margin-bottom:6px;padding:0;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.card{background:var(--card);border-radius:8px;padding:14px}
.lbl{font-size:13px;color:var(--mute)}
.big{font-size:30px;font-weight:600;line-height:1.25}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g3 .card{text-align:center;padding:10px 6px}
.g3 b{display:block;font-size:18px;font-weight:500}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
h2{font-family:var(--display);font-size:17px;margin:0}
.ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600}
.ic.sm{width:26px;height:26px;font-size:12px}
.day{padding:0;overflow:hidden}
.day .dh{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--rule)}
.day .dn{font-size:34px;line-height:1;font-weight:300}
.day .dt{flex:1;line-height:1.25}
.day .ds{text-align:end;line-height:1.3}
.li{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;text-align:start}
.li .mid{flex:1;min-width:0;overflow-wrap:anywhere}
.li .mid small{display:block;color:var(--mute);font-size:13px}
.li .amt{text-align:end;font-weight:500}
.li .amt small{display:block;color:var(--mute);font-size:12px;font-weight:400}
.more{display:block;width:100%;text-align:center;color:var(--move);padding:10px;border-top:1px solid var(--rule)}
.txc{display:block;width:100%;text-align:start;background:var(--card);border-radius:8px;padding:10px 14px}
.txc .when{font-size:13px;color:var(--mute)}
mark{background:color-mix(in srgb,var(--gold) 40%,transparent);color:inherit;border-radius:3px}
.wal{color:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px;position:relative}
.wal .nm{font-weight:600;display:flex;justify-content:space-between;align-items:center}
.wal .bl{font-size:30px;font-weight:600}
.wal .acts{display:flex;gap:18px;margin-top:6px;opacity:.9}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 4px;text-align:start;font-size:17px;border-bottom:1px solid var(--rule)}
.menu .tag{margin-inline-start:auto;font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:1px 9px}
.fld{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px 14px;border-radius:8px;width:100%;text-align:start}
.fld .v{flex:1;min-width:0}
.fld small{display:block;color:var(--mute);font-size:13px}
input,select{background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.amtrow{display:grid;grid-template-columns:1fr 104px;gap:8px}
.amtrow input{font-size:24px}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:13px;font-weight:600;width:100%;text-align:center}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:none;color:var(--out);border:1px solid var(--out)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov{position:fixed;inset:0;background:rgba(5,9,16,.6);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.ov .box{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
.ov .box>*{flex:none}
#pick{z-index:6}
.bud .tr{height:22px;background:var(--card2);border-radius:3px;overflow:hidden;flex:1}
.bud .tr i{display:block;height:100%;background:var(--in)}
.bud .tr i.over{background:var(--out)}
.note{font-size:13px;color:var(--mute);border-inline-start:3px solid var(--gold);padding-inline-start:10px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border-radius:999px;padding:6px 14px;font-size:14px}
.ph3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph3 button.t{aspect-ratio:1;width:100%;border-radius:6px;background-size:cover;background-position:center;background-color:var(--card2)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
#lock.on{display:flex}
#lock .dots{display:flex;gap:16px;direction:ltr}
#lock .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
#lock .dots i.f{background:var(--ink)}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;direction:ltr}
#lock .pad button{height:72px;border:2px solid var(--ink);border-radius:8px;font-size:24px;font-weight:600}
.pillb{background:var(--move);color:#fff;border-radius:999px;padding:8px 22px;font-weight:600;align-self:center}
svg text{fill:var(--mute);font-family:var(--body);font-size:10px}
@media (prefers-reduced-motion:no-preference){.ov .box{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px)}to{transform:none}}}
</style>
</head>
<body>
<div id="app"><header id="hd"></header><div id="tb"></div><main id="main"></main><nav id="nav"></nav></div>
<div class="ov" id="sheet"><div class="box" id="box"></div></div>
<div id="lock"></div>
<div class="ov" id="pick"><div class="box" id="pbox"></div></div>
